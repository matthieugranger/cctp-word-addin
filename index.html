<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CCTP Assistant IA - Multi-Modèles</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    /* ... Vos styles d'origine conservés ... */
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --bleu-tech: #0052CC;
      --bleu-clair: #E8F0FE;
      --bleu-fonce: #003087;
      --gris-100: #F7F8FA;
      --gris-200: #EAECEF;
      --gris-400: #9AA3B0;
      --gris-700: #3D4450;
      --noir: #1A1E2B;
      --vert: #0A7655;
      --vert-clair: #E6F4EF;
      --orange: #B84800;
      --orange-clair: #FDF0E6;
      --rouge: #C0392B;
      --rouge-clair: #FDECEA;
      --bordure: #D0D5DD;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      color: var(--noir);
      background: var(--gris-100);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: var(--bleu-fonce);
      color: white;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      border-bottom: 3px solid var(--bleu-tech);
    }
    .header-logo {
      width: 28px; height: 28px;
      background: var(--bleu-tech);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: white;
      font-family: 'IBM Plex Mono', monospace;
      flex-shrink: 0;
    }
    .header-title { font-size: 13px; font-weight: 600; line-height: 1.2; }
    .header-sub { font-size: 10px; color: rgba(255,255,255,0.65); margin-top: 1px; }

    /* ── NOUVEAU STYLE CONFIG API ── */
    #api-setup {
      background: #fff;
      border-bottom: 1px solid var(--bordure);
      padding: 12px 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .api-config-row { display: flex; gap: 6px; align-items: center; }
    .small-label { font-size: 10px; font-weight: 600; color: var(--gris-700); text-transform: uppercase; margin-bottom: 2px; }
    .api-input-group { flex: 1; display: flex; flex-direction: column; }
    
    #api-key-input, #api-provider, #api-model {
      padding: 6px; font-size: 11px;
      border: 1px solid var(--bordure); border-radius: 4px;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    #api-key-input { font-family: 'IBM Plex Mono', monospace; }

    #save-api-btn {
      padding: 8px 12px; font-size: 11px; font-weight: 600;
      background: var(--bleu-tech); color: white; border: none;
      border-radius: 4px; cursor: pointer; align-self: flex-end;
    }

    /* ── RESTE DU STYLE (Main, Cards, etc.) ── */
    .main { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: white; border: 1px solid var(--bordure); border-radius: 6px; overflow: hidden; }
    .card-header { padding: 8px 12px; background: var(--gris-100); border-bottom: 1px solid var(--bordure); font-size: 11px; font-weight: 600; color: var(--gris-700); text-transform: uppercase; }
    .card-body { padding: 12px; }
    .context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .ctx-btn { padding: 6px 8px; border: 1px solid var(--bordure); border-radius: 5px; background: white; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: var(--gris-700); cursor: pointer; transition: all 0.15s; }
    .ctx-btn.active { border-color: var(--bleu-tech); background: var(--bleu-clair); color: var(--bleu-fonce); font-weight: 600; }
    .mode-tabs { display: flex; border-bottom: 1px solid var(--bordure); background: var(--gris-100); }
    .mode-tab { flex: 1; padding: 8px 6px; border: none; background: transparent; font-size: 11px; cursor: pointer; border-bottom: 2px solid transparent; }
    .mode-tab.active { color: var(--bleu-tech); border-bottom-color: var(--bleu-tech); background: white; font-weight: 600; }
    #input-text { width: 100%; padding: 10px; border: 1px solid var(--bordure); border-radius: 5px; font-size: 12px; line-height: 1.6; min-height: 90px; }
    .btn-row { display: flex; gap: 6px; margin-top: 8px; }
    .btn-primary { flex: 1; padding: 9px 12px; background: var(--bleu-tech); color: white; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
    .btn-primary:disabled { background: var(--gris-400); }
    .btn-secondary { padding: 9px 12px; background: white; border: 1px solid var(--bordure); border-radius: 5px; font-size: 12px; cursor: pointer; }
    #result-container { display: none; margin-top: 12px; }
    #result-text { background: var(--gris-100); border: 1px solid var(--bordure); border-radius: 5px; padding: 10px; font-size: 12px; white-space: pre-wrap; }
    .result-actions { display: flex; gap: 6px; margin-top: 8px; }
    .btn-insert { flex: 1; padding: 8px; background: var(--vert); color: white; border: none; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-replace { flex: 1; padding: 8px; background: white; color: var(--vert); border: 1.5px solid var(--vert); border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-copy { padding: 8px 10px; background: white; border: 1px solid var(--bordure); border-radius: 5px; font-size: 11px; cursor: pointer; }
    #loading { display: none; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--bleu-clair); border-top-color: var(--bleu-tech); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-bar { padding: 6px 12px; font-size: 10.5px; display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--bordure); background: white; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; }
    .ok .status-dot { background: var(--vert); }
    .err .status-dot { background: var(--rouge); }
    .suggestion-card { border: 1px solid var(--bordure); border-radius: 5px; margin-bottom: 8px; background: white; }
    .suggestion-header { padding: 7px 10px; background: var(--gris-100); display: flex; align-items: center; gap: 6px; }
    .suggestion-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; }
    .badge-critique { background: var(--rouge-clair); color: var(--rouge); }
    .badge-amelioration { background: var(--orange-clair); color: var(--orange); }
    .suggestion-body { padding: 8px 10px; font-size: 11px; }
    code { background: var(--bleu-clair); padding: 2px 4px; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">CC</div>
  <div>
    <div class="header-title">CCTP Assistant IA</div>
    <div class="header-sub">Rédaction technique — Multi-IA</div>
  </div>
</div>

<div id="api-setup">
  <div class="api-config-row">
    <div class="api-input-group">
      <span class="small-label">Fournisseur</span>
      <select id="api-provider" onchange="updateProviderSettings()">
        <option value="anthropic">Anthropic</option>
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
      </select>
    </div>
    <div class="api-input-group">
      <span class="small-label">Modèle</span>
      <input type="text" id="api-model" placeholder="claude-3-5-sonnet-latest" />
    </div>
  </div>
  <div class="api-input-group">
    <span class="small-label">Clé API</span>
    <input type="password" id="api-key-input" placeholder="Saisir votre clé..." />
  </div>
  <button id="save-api-btn" onclick="saveApiConfig()">Valider la configuration</button>
</div>

<div class="main">
  <div class="card">
    <div class="card-header">📐 Type de lot</div>
    <div class="card-body">
      <div class="context-grid">
        <button class="ctx-btn active" data-ctx="genie-civil" onclick="selectContext(this)">🏗 Génie civil</button>
        <button class="ctx-btn" data-ctx="electricite" onclick="selectContext(this)">⚡ Électricité</button>
        <button class="ctx-btn" data-ctx="cvc" onclick="selectContext(this)">🌡 CVC</button>
        <button class="ctx-btn" data-ctx="vrd" onclick="selectContext(this)">🛣 VRD</button>
        <button class="ctx-btn" data-ctx="facades" onclick="selectContext(this)">🪟 Façades</button>
        <button class="ctx-btn" data-ctx="generique" onclick="selectContext(this)">📋 Générique</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="reformulation" onclick="switchMode(this)">✏️ Reformuler</button>
      <button class="mode-tab" data-mode="suggestions" onclick="switchMode(this)">💡 Suggestions</button>
      <button class="mode-tab" data-mode="verification" onclick="switchMode(this)">✔ Vérifier</button>
    </div>
    <div class="card-body">
      <textarea id="input-text" placeholder="Collez votre texte CCTP ici..."></textarea>
      
      <div id="options-reformulation" class="option-row" style="margin-top:10px;">
        <select class="btn-secondary" id="refLevel" style="width:100%">
          <option value="leger">Léger – structure conservée</option>
          <option value="modere" selected>Modéré – clarté améliorée</option>
          <option value="complet">Complet – réécriture professionnelle</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="btn-secondary" onclick="importSelection()">📥 Importer Word</button>
        <button class="btn-primary" id="run-btn" onclick="runAnalysis()" disabled>▶ Lancer l'IA</button>
      </div>
    </div>
  </div>

  <div id="loading" class="card">
    <div style="display:flex;align-items:center;gap:10px;padding:12px">
      <div class="spinner"></div>
      <span id="loading-text">Analyse en cours...</span>
    </div>
  </div>

  <div id="result-container" class="card">
    <div class="card-header">📄 Résultat</div>
    <div class="card-body">
      <div id="result-text"></div>
      <div class="result-actions">
        <button class="btn-insert" onclick="insertResult()">➕ Insérer</button>
        <button class="btn-replace" onclick="replaceSelection()">↔ Remplacer</button>
        <button class="btn-copy" onclick="copyResult()">📋 Copier</button>
      </div>
    </div>
  </div>

  <div id="suggestions-container" class="card" style="display:none">
    <div class="card-header">💡 Suggestions</div>
    <div class="card-body" id="suggestions-list"></div>
  </div>
</div>

<div id="status-bar">
  <div class="status-dot"></div>
  <span id="status-text">Prêt</span>
</div>

<script>
// ── STATE ──
let currentProvider = 'anthropic';
let currentContext = 'genie-civil';
let currentMode = 'reformulation';
let lastResult = '';

const defaultModels = {
  anthropic: 'claude-3-5-sonnet-latest',
  groq: 'llama-3.3-70b-versatile',
  openrouter: 'google/gemini-2.0-flash-001'
};

// ── INIT ──
Office.onReady((info) => {
  loadConfig();
});

function loadConfig() {
  const provider = localStorage.getItem('cctp_provider') || 'anthropic';
  document.getElementById('api-provider').value = provider;
  currentProvider = provider;
  
  updateProviderSettings();
  
  const key = localStorage.getItem(`cctp_key_${provider}`);
  if (key) {
    document.getElementById('api-key-input').value = key;
    document.getElementById('run-btn').disabled = false;
    setStatus('ok', `Prêt (${provider})`);
  }
}

function updateProviderSettings() {
  const provider = document.getElementById('api-provider').value;
  currentProvider = provider;
  
  // Charger le modèle sauvegardé ou par défaut
  const savedModel = localStorage.getItem(`cctp_model_${provider}`);
  document.getElementById('api-model').value = savedModel || defaultModels[provider];
  
  // Charger la clé API si elle existe
  const savedKey = localStorage.getItem(`cctp_key_${provider}`);
  document.getElementById('api-key-input').value = savedKey || '';
}

function saveApiConfig() {
  const provider = document.getElementById('api-provider').value;
  const key = document.getElementById('api-key-input').value.trim();
  const model = document.getElementById('api-model').value.trim();
  
  if(!key) { alert("Clé requise"); return; }
  
  localStorage.setItem('cctp_provider', provider);
  localStorage.setItem(`cctp_key_${provider}`, key);
  localStorage.setItem(`cctp_model_${provider}`, model);
  
  document.getElementById('run-btn').disabled = false;
  setStatus('ok', 'Configuration sauvegardée');
}

// ── LOGIQUE WORD & UI ──
function selectContext(btn) {
  document.querySelectorAll('.ctx-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentContext = btn.dataset.ctx;
}

function switchMode(tab) {
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentMode = tab.dataset.mode;
  document.getElementById('options-reformulation').style.display = currentMode === 'reformulation' ? 'block' : 'none';
  hideResults();
}

function hideResults() {
  document.getElementById('result-container').style.display = 'none';
  document.getElementById('suggestions-container').style.display = 'none';
}

async function importSelection() {
  try {
    await Word.run(async (ctx) => {
      const sel = ctx.document.getSelection();
      sel.load('text');
      await ctx.sync();
      document.getElementById('input-text').value = sel.text.trim();
    });
  } catch(e) { setStatus('err', 'Erreur import'); }
}

// ── ANALYSE IA ──
async function runAnalysis() {
  const text = document.getElementById('input-text').value.trim();
  const apiKey = localStorage.getItem(`cctp_key_${currentProvider}`);
  const model = document.getElementById('api-model').value.trim();
  
  if (!text || !apiKey) return;

  setLoading(true);
  hideResults();

  const prompt = buildPrompt(text);

  try {
    let response;
    let resultText = '';

    if (currentProvider === 'anthropic') {
      response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: model,
          max_tokens: 2000,
          messages: [{ role: 'user', content: prompt }]
        })
      });
      const data = await response.json();
      resultText = data.content[0].text;

    } else {
      // Groq & OpenRouter utilisent le format OpenAI
      const url = currentProvider === 'groq' 
        ? 'https://api.groq.com/openai/v1/chat/completions' 
        : 'https://openrouter.ai/api/v1/chat/completions';

      response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`,
          'HTTP-Referer': 'https://cctp-assistant.local', // Requis par OpenRouter
          'X-Title': 'CCTP Assistant'
        },
        body: JSON.stringify({
          model: model,
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.3
        })
      });
      const data = await response.json();
      resultText = data.choices[0].message.content;
    }

    if (!response.ok) throw new Error('Erreur API');

    if (currentMode === 'suggestions') {
      parseSuggestions(resultText);
    } else {
      lastResult = resultText;
      document.getElementById('result-text').textContent = resultText;
      document.getElementById('result-container').style.display = 'block';
    }
    setStatus('ok', 'Analyse terminée');

  } catch(e) {
    setStatus('err', 'Erreur : ' + e.message);
  } finally {
    setLoading(false);
  }
}

function buildPrompt(text) {
  const ctx = currentContext;
  let base = `Tu es un expert en CCTP (Marchés Publics Français) pour le lot ${ctx}. Respecte le style technique (infinitif/futur), les normes NF/DTU et évite toute ambiguïté.`;
  
  if (currentMode === 'reformulation') {
    return `${base} Reformule le texte suivant avec un niveau de précision accru : \n\n${text}`;
  } else if (currentMode === 'suggestions') {
    return `${base} Analyse les lacunes techniques ou juridiques du texte suivant et réponds au format JSON strict: {"suggestions":[{"type":"CRITIQUE","titre":"...","probleme":"...","correction":"..."}]} \n\nTexte: ${text}`;
  } else {
    return `${base} Vérifie la conformité de ce texte par rapport au CCAG Travaux 2021 : \n\n${text}`;
  }
}

function parseSuggestions(raw) {
  try {
    const clean = raw.replace(/```json|```/g, '').trim();
    const data = JSON.parse(clean);
    const list = document.getElementById('suggestions-list');
    list.innerHTML = '';
    data.suggestions.forEach(s => {
      const div = document.createElement('div');
      div.className = 'suggestion-card';
      div.innerHTML = `<div class="suggestion-header"><span class="suggestion-badge badge-amelioration">${s.type}</span> <b>${s.titre}</b></div>
                       <div class="suggestion-body">${s.probleme}<br><code>${s.correction}</code></div>`;
      list.appendChild(div);
    });
    document.getElementById('suggestions-container').style.display = 'block';
  } catch(e) {
    document.getElementById('result-text').textContent = raw;
    document.getElementById('result-container').style.display = 'block';
  }
}

// ── FONCTIONS WORD ──
async function insertResult() {
  if (!lastResult) return;
  await Word.run(async (ctx) => {
    ctx.document.getSelection().insertParagraphAfter(lastResult, "After");
    await ctx.sync();
  });
}

async function replaceSelection() {
  if (!lastResult) return;
  await Word.run(async (ctx) => {
    ctx.document.getSelection().insertText(lastResult, "Replace");
    await ctx.sync();
  });
}

function copyResult() {
  navigator.clipboard.writeText(lastResult);
  setStatus('ok', 'Copié !');
}

function setLoading(on) {
  document.getElementById('loading').style.display = on ? 'block' : 'none';
  document.getElementById('run-btn').disabled = on;
}

function setStatus(type, msg) {
  const bar = document.getElementById('status-bar');
  bar.className = type;
  document.getElementById('status-text').textContent = msg;
}
</script>
</body>
</html>
